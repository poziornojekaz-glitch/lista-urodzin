name: Zbuduj APK (Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj środowisko Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Skonfiguruj Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Wygeneruj brakujące pliki platformy Android
        working-directory: listaurodzin
        run: flutter create --platforms=android --org com.example .

      - name: Dopasuj wersje Android SDK (compileSdk 35, minSdk 21)
        working-directory: listaurodzin
        run: |
          find android -name "build.gradle*" -exec sed -i 's/flutter.compileSdkVersion/35/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/flutter.minSdkVersion/21/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/flutter.targetSdkVersion/35/g' {} + || true
          find android -name "build.gradle*" -exec sed -i -E 's/(compileSdk|compileSdkVersion)( =)? [0-9]+/\1\2 35/g' {} + || true
          find android -name "build.gradle*" -exec sed -i -E 's/(minSdk|minSdkVersion)( =)? [0-9]+/\1\2 21/g' {} + || true
          echo "flutter.compileSdkVersion=35" >> android/local.properties || true
          echo "flutter.minSdkVersion=21" >> android/local.properties || true
          echo "flutter.targetSdkVersion=35" >> android/local.properties || true
          if [ -f android/build.gradle ]; then
            echo "" >> android/build.gradle
            echo "subprojects {" >> android/build.gradle
            echo "    afterEvaluate { project ->" >> android/build.gradle
            echo "        if (project.hasProperty('android')) {" >> android/build.gradle
            echo "            project.android {" >> android/build.gradle
            echo "                compileSdkVersion 35" >> android/build.gradle
            echo "            }" >> android/build.gradle
            echo "        }" >> android/build.gradle
            echo "    }" >> android/build.gradle
            echo "}" >> android/build.gradle
          fi

      - name: Pobierz pakiety i zależności
        working-directory: listaurodzin
        run: flutter pub get

      - name: Wygeneruj ikony aplikacji (Launcher Icon)
        working-directory: listaurodzin
        run: dart run flutter_launcher_icons || true

      - name: Zbuduj plik APK (Release)
        working-directory: listaurodzin
        run: flutter build apk --release --no-tree-shake-icons

      - name: Udostępnij gotowy plik APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: lista-urodzin-apk
          path: listaurodzin/build/app/outputs/flutter-apk/app-release.apk
