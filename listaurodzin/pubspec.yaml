name: listaurodzin
description: Aplikacja do przypominania o urodzinach.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  awesome_notifications: ^0.10.0
  provider: ^6.1.2
